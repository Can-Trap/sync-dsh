<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sync a codebase to Open Design">
  <defs>
    <linearGradient id="syncdsh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2891e2"/>
      <stop offset="1" stop-color="#1b6fb5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#syncdsh)"/>
  <!-- codebase: a file with a caret -->
  <rect x="11" y="15" width="17" height="21" rx="3" fill="none" stroke="#fff" stroke-width="2.4" opacity=".95"/>
  <path d="M17 22l4 3.5-4 3.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22.5 31.5h3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
  <!-- design system: swatches -->
  <rect x="36" y="15" width="17" height="9" rx="2.5" fill="none" stroke="#fff" stroke-width="2.4" opacity=".95"/>
  <rect x="36" y="28" width="17" height="9" rx="2.5" fill="#fff" opacity=".55"/>
  <!-- the two-way sync arrows -->
  <path d="M23 43h18" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M27 39.5 23.5 43 27 46.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M41 53H23" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".8"/>
  <path d="M37 49.5 40.5 53 37 56.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
</svg>
